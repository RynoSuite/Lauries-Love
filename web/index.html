<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F474C" />
    <meta name="description" content="Laurie’s Love — so no warrior ever walks alone." />
    <title>Laurie's Love</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Figtree:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Light/dark, before the first paint. The app sets this again once React
      // mounts, but that is several hundred milliseconds of a dark page for a
      // member who chose light — long enough to read as a bug. Inline and
      // synchronous on purpose; a deferred script is already too late.
      // Key must match COLOR_MODE_KEY in src/lib/colorMode.tsx.
      try {
        if (localStorage.getItem('ll.color-mode') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
